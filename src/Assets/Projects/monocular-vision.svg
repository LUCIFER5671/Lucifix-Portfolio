<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2a1f45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="300" rx="16" fill="#1b1330"/>
  <rect width="480" height="300" rx="16" fill="url(#grid)"/>

  <!-- Field of view -->
  <path d="M134 150 L440 44 L440 214 Z" fill="#c770f0" fill-opacity="0.12"/>
  <path d="M134 150 L440 44 M134 150 L440 214" stroke="#c770f0" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Single camera -->
  <rect x="44" y="124" width="72" height="52" rx="10" fill="#623686" stroke="#c770f0" stroke-width="2"/>
  <rect x="58" y="114" width="22" height="12" rx="3" fill="#623686" stroke="#c770f0" stroke-width="2"/>
  <circle cx="118" cy="150" r="16" fill="#1b1330" stroke="#e3b6ff" stroke-width="4"/>
  <circle cx="118" cy="150" r="5" fill="#c770f0"/>

  <!-- Object, drawn as detected edges -->
  <g fill="none" stroke="#e3b6ff" stroke-width="3" stroke-linejoin="round">
    <path d="M336 76 H396 V136 H336 Z"/>
    <path d="M336 76 L356 58 H416 V118 L396 136 M396 76 L416 58"/>
  </g>
  <g fill="#c770f0">
    <circle cx="336" cy="76" r="3.5"/>
    <circle cx="396" cy="76" r="3.5"/>
    <circle cx="396" cy="136" r="3.5"/>
    <circle cx="336" cy="136" r="3.5"/>
    <circle cx="356" cy="58" r="3.5"/>
    <circle cx="416" cy="58" r="3.5"/>
    <circle cx="416" cy="118" r="3.5"/>
  </g>

  <!-- Line of sight and angle -->
  <path d="M134 150 H250" stroke="#8a49a8" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M134 150 L366 106" stroke="#c770f0" stroke-width="2.5"/>
  <circle cx="366" cy="106" r="4" fill="#ffffff"/>
  <path d="M214 150 A80 80 0 0 0 212.6 135.1" fill="none" stroke="#e3b6ff" stroke-width="2.5"/>
  <text x="224" y="149" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e3b6ff">θ</text>

  <!-- Distance -->
  <path d="M366 136 V246 M118 176 V246" stroke="#8a49a8" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M118 240 H366" stroke="#e3b6ff" stroke-width="2.5"/>
  <path d="M128 233 L118 240 L128 247 M356 233 L366 240 L356 247" fill="none" stroke="#e3b6ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="242" y="268" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#e3b6ff">d</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2a1f45" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="300" rx="16" fill="#1b1330"/>
  <rect width="480" height="300" rx="16" fill="url(#grid)"/>

  <!-- Door -->
  <rect x="316" y="44" width="124" height="228" rx="6" fill="#2a1d45" stroke="#8a49a8" stroke-width="3"/>
  <rect x="334" y="64" width="88" height="82" rx="4" fill="none" stroke="#623686" stroke-width="2.5"/>
  <rect x="334" y="162" width="88" height="90" rx="4" fill="none" stroke="#623686" stroke-width="2.5"/>
  <circle cx="424" cy="160" r="6" fill="#e3b6ff"/>

  <!-- Unlocked padlock -->
  <g transform="translate(378 105)">
    <path d="M-9 -4 V-12 A9 9 0 0 1 9 -12 V-10" fill="none" stroke="#c770f0" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="-4" width="32" height="26" rx="5" fill="#623686" stroke="#c770f0" stroke-width="2"/>
    <circle cx="0" cy="8" r="3.5" fill="#e3b6ff"/>
  </g>

  <!-- Camera above the door -->
  <rect x="236" y="40" width="52" height="8" rx="3" fill="#8a49a8"/>
  <path d="M252 70 L172 96 L172 228 Z" fill="#c770f0" fill-opacity="0.12"/>
  <rect x="244" y="48" width="40" height="26" rx="7" fill="#623686" stroke="#c770f0" stroke-width="2"/>
  <circle cx="256" cy="66" r="7" fill="#1b1330" stroke="#e3b6ff" stroke-width="3"/>

  <!-- Face -->
  <g fill="none" stroke="#e3b6ff" stroke-width="3" stroke-linecap="round">
    <ellipse cx="110" cy="160" rx="40" ry="50"/>
    <path d="M110 156 V168" stroke-width="2.5"/>
    <path d="M96 182 Q110 192 124 182"/>
  </g>
  <circle cx="96" cy="150" r="4" fill="#e3b6ff"/>
  <circle cx="124" cy="150" r="4" fill="#e3b6ff"/>

  <!-- Detection box -->
  <g fill="none" stroke="#c770f0" stroke-width="4" stroke-linecap="round">
    <path d="M52 116 V98 H70"/>
    <path d="M150 98 H168 V116"/>
    <path d="M52 204 V222 H70"/>
    <path d="M150 222 H168 V204"/>
  </g>

  <!-- Wave pattern used for matching -->
  <path d="M70 250 q10 -12 20 0 t20 0 t20 0 t20 0" fill="none" stroke="#c770f0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Match -->
  <circle cx="178" cy="88" r="15" fill="#623686" stroke="#c770f0" stroke-width="2"/>
  <path d="M171 88 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Message sent to the user -->
  <g transform="translate(200 196)">
    <path d="M18 50 L14 66 L32 50" fill="#623686" stroke="#c770f0" stroke-width="2" stroke-linejoin="round"/>
    <rect width="92" height="52" rx="10" fill="#623686" stroke="#c770f0" stroke-width="2"/>
    <path d="M14 18 H78 M14 32 H62" stroke="#e3b6ff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

  <!-- Robot arm -->
  <path d="M270 366 H450" stroke="#8a49a8" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="300" y="340" width="120" height="24" rx="6" fill="#623686"/>
  <path d="M318 340 A42 30 0 0 1 402 340 Z" fill="#2c2048" stroke="#c770f0" stroke-width="2"/>
  <g stroke-linecap="round">
    <path d="M360 322 L330 230" stroke="#8a49a8" stroke-width="22"/>
    <path d="M330 230 L410 170" stroke="#8a49a8" stroke-width="18"/>
  </g>
  <circle cx="360" cy="322" r="14" fill="#623686" stroke="#e3b6ff" stroke-width="3"/>
  <circle cx="330" cy="230" r="16" fill="#623686" stroke="#e3b6ff" stroke-width="3"/>
  <circle cx="410" cy="170" r="13" fill="#623686" stroke="#e3b6ff" stroke-width="3"/>
  <path d="M418 164 L438 150 L452 158 M418 176 L438 190 L452 182" fill="none" stroke="#e3b6ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

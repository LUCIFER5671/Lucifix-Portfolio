<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400">
  <!-- Neural network -->
  <g stroke="#623686" stroke-width="2">
    <path d="M60 80 L150 60 M60 80 L150 120 M60 80 L150 180 M60 80 L150 240"/>
    <path d="M60 140 L150 60 M60 140 L150 120 M60 140 L150 180 M60 140 L150 240"/>
    <path d="M60 200 L150 60 M60 200 L150 120 M60 200 L150 180 M60 200 L150 240"/>
    <path d="M150 60 L240 110 M150 60 L240 190 M150 120 L240 110 M150 120 L240 190"/>
    <path d="M150 180 L240 110 M150 180 L240 190 M150 240 L240 110 M150 240 L240 190"/>
  </g>
  <g fill="#1b1330" stroke="#c770f0" stroke-width="3">
    <circle cx="60" cy="80" r="11"/>
    <circle cx="60" cy="140" r="11"/>
    <circle cx="60" cy="200" r="11"/>
    <circle cx="150" cy="60" r="11"/>
    <circle cx="150" cy="120" r="11"/>
    <circle cx="150" cy="180" r="11"/>
    <circle cx="150" cy="240" r="11"/>
  </g>
  <g fill="#c770f0" stroke="#e3b6ff" stroke-width="3">
    <circle cx="240" cy="110" r="12"/>
    <circle cx="240" cy="190" r="12"/>
